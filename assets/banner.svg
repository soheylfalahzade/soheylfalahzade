<radialGradient id="g1" cx=".82" cy=".05" r=".6"><stop offset="0" stop-color="#6fa8d6" stop-opacity=".32"/><stop offset="1" stop-color="#6fa8d6" stop-opacity="0"/></radialGradient>
<pattern id="gr" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".04"/></pattern>
