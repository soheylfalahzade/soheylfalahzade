<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" role="img" aria-label="Three layers: the eyes, the arteries, the reflexes" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<g fill="#101a24" stroke="#22323f"><rect x="6" y="8" width="312" height="234" rx="14"/><rect x="344" y="8" width="312" height="234" rx="14"/><rect x="682" y="8" width="312" height="234" rx="14"/></g>
<g><rect x="6" y="8" width="312" height="4" rx="2" fill="#6fa8d6"/><rect x="344" y="8" width="312" height="4" rx="2" fill="#7fd1b0"/><rect x="682" y="8" width="312" height="4" rx="2" fill="#ffb454"/></g>
<g font-family="Georgia,'Times New Roman',serif" font-size="24" fill="#e3ebf1"><text x="28" y="50">The eyes</text><text x="366" y="50">The arteries</text><text x="704" y="50">The reflexes</text></g>
<g font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#8fa5b4">
<text x="28" y="74">Detect vehicles, and know how far to</text><text x="28" y="92">trust the camera when it is occluded.</text>
<text x="366" y="74">Reduce a city to a sparse backbone</text><text x="366" y="92">that keeps every detour bounded.</text>
<text x="704" y="74">Move traffic without blocking the</text><text x="704" y="92">junction, and clear the way in time.</text></g>
<!-- eyes illustration -->
<path d="M60 232L264 232L190 116L134 116Z" fill="#15222d"/><path d="M162 116V232" stroke="#fff" stroke-opacity=".2" stroke-dasharray="6 7"/>
<rect x="86" y="190" width="44" height="26" rx="4" fill="#3b5568"/><rect x="190" y="150" width="30" height="20" rx="3" fill="#3b5568"/><rect x="178" y="156" width="52" height="40" rx="3" fill="#2a3a47"/>
<g fill="none" stroke-width="2"><rect x="80" y="183" width="56" height="40" stroke="#6fa8d6"/><rect x="184" y="143" width="42" height="30" stroke="#7fd1b0" stroke-dasharray="4 3"/></g>
<!-- arteries illustration -->
<g stroke="#6fa8d6" stroke-opacity=".3" fill="none"><path d="M388 128L450 118L520 134L590 120L630 130M382 190L452 180L522 196L592 182L634 192M388 232L452 224L520 234L590 226L630 232"/><path d="M388 128L382 190L388 232M450 118L452 180L452 224M520 134L522 196L520 234M590 120L592 182L590 226M630 130L634 192L630 232"/></g>
<path d="M388 232L452 224L522 196L520 134L590 120L630 130" stroke="#7fd1b0" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<g fill="#6fa8d6" opacity=".8"><circle cx="388" cy="128" r="3"/><circle cx="450" cy="118" r="3"/><circle cx="520" cy="134" r="3"/><circle cx="590" cy="120" r="3"/><circle cx="630" cy="130" r="3"/><circle cx="382" cy="190" r="3"/><circle cx="452" cy="180" r="3"/><circle cx="522" cy="196" r="3"/><circle cx="592" cy="182" r="3"/><circle cx="634" cy="192" r="3"/><circle cx="388" cy="232" r="3"/><circle cx="452" cy="224" r="3"/><circle cx="520" cy="234" r="3"/><circle cx="590" cy="226" r="3"/><circle cx="630" cy="232" r="3"/></g>
<circle r="5" fill="#ffb454"><animateMotion dur="5s" repeatCount="indefinite" path="M388 232L452 224L522 196L520 134L590 120L630 130"/></circle>
<!-- reflexes illustration -->
<rect x="728" y="112" width="40" height="118" rx="10" fill="#0d1620" stroke="#22323f"/><circle cx="748" cy="136" r="11" fill="#d9534f" opacity=".25"/><circle cx="748" cy="171" r="11" fill="#ffb454" opacity=".25"/><circle cx="748" cy="206" r="11" fill="#7fd1b0"><animate attributeName="opacity" values="1;.55;1" dur="2.4s" repeatCount="indefinite"/></circle>
<g font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#8fa5b4"><text x="800" y="138">north</text><text x="800" y="178">east</text><text x="800" y="218">ambulance lane</text></g>
<g><rect x="800" y="146" width="150" height="10" rx="5" fill="#22323f"/><rect x="800" y="146" width="112" height="10" rx="5" fill="#6fa8d6"/><rect x="800" y="186" width="150" height="10" rx="5" fill="#22323f"/><rect x="800" y="186" width="70" height="10" rx="5" fill="#6fa8d6"/><rect x="800" y="226" width="150" height="10" rx="5" fill="#22323f"/><rect x="800" y="226" width="150" height="10" rx="5" fill="#ffb454"/></g>
<g stroke="#8fa5b4" stroke-width="2" fill="none" stroke-linecap="round"><path d="M326 124L336 130L326 136"/><path d="M664 124L674 130L664 136"/></g>
